[pytest]
# tests/ 下多数文件是**独立 CI 脚本**（各自 `if __name__ == "__main__"` 直跑、末尾
# sys.exit），不是 pytest 用例——请直接用 `python tests/<script>.py` 运行它们：
#   ci_check.py / static_checks.py / docs_consistency.py / fuzz_inputs.py
#   cross_engine.py / e2e_matrix.py / prop_scraper.py / test_rangedl_manual.py
# 本文件只声明 pytest 该收集什么：tests/test_*.py 里真正的用例（当前为 test_smoke.py）。
# 背景（审查修正）：此前 test_rangedl_manual.py 顶层 `sys.exit(...)`，pytest 一 import
# 就 SystemExit → INTERNALERROR、0 用例；已加 __main__ 守卫，本文件固化收集规则。
python_files = test_*.py
testpaths = tests
addopts = -q
