name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cssselect pyflakes pandas pyarrow pydantic hypothesis

      - name: 编译检查（全部 .py）
        run: python -m compileall -q universal_scraper scripts examples

      - name: pyflakes（未定义名必须为 0）
        run: |
          pip install pyflakes
          python -m pyflakes universal_scraper examples | grep "undefined name" && exit 1 || exit 0

      - name: CI 自检（行为探针 + 夹具）
        run: python tests/ci_check.py

      - name: 属性测试（hypothesis）
        run: |
          pip install hypothesis
          python tests/prop_scraper.py .
