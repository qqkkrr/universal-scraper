name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cssselect pyflakes pandas pyarrow pydantic hypothesis pytest

      - name: 编译检查（全部 .py）
        run: python -m compileall -q universal_scraper scripts examples

      - name: 单元用例（pytest；环境依赖/过时用例见 tests/ci_deselect.txt）
        run: |
          # 只对"存在的文件"下 --deselect：本机 tests/ 是远端子集时不会因缺文件报错
          DESELECT=$(grep -v '^#' tests/ci_deselect.txt | grep -v '^$' | while read -r t; do \
              [ -f "${t%%::*}" ] && printf -- '--deselect %s ' "$t"; done)
          python -m pytest -q $DESELECT

      - name: pyflakes（未定义名必须为 0）
        run: |
          pip install pyflakes
          python -m pyflakes universal_scraper examples | grep "undefined name" && exit 1 || exit 0

      - name: CI 自检（行为探针 + 夹具）
        run: python tests/ci_check.py

      - name: 静态缺陷检查（同锁嵌套/裸 except/可变默认）
        run: python tests/static_checks.py

      - name: 文档-代码一致性（幽灵命令/类型/CLI 关键参数）
        run: python tests/docs_consistency.py

      - name: 模糊测试（畸配置/管道步骤/HTML；200 轮）
        run: python tests/fuzz_inputs.py 200

      - name: 跨引擎一致性（v2 vs v3 同语义）
        run: python tests/cross_engine.py

      - name: 端到端 CLI 矩阵（本地站点，27 项）
        run: python tests/e2e_matrix.py

      - name: 属性测试（hypothesis）
        run: |
          pip install hypothesis
          python tests/prop_scraper.py .
