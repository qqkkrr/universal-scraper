[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-scraper"
version = "2.1.0"
description = "配置驱动的万能爬虫引擎：HTTP/浏览器/桥取数，反爬四级方案，断点续跑，增量去重"
requires-python = ">=3.10"
dependencies = ["lxml", "requests", "openpyxl", "cssselect"]

[project.optional-dependencies]
ocr = ["ddddocr", "opencv-python-headless"]

[project.scripts]
universal-scraper = "universal_scraper.cli:main"

[tool.setuptools]
packages = ["universal_scraper"]
